[package]
name = "gitlite"
version = "0.1.0"
description = "GitLite — client Git desktop léger"
authors = ["GitLite"]
edition = "2021"
rust-version = "1.77"

[lib]
# `_lib` pour éviter tout conflit de nom sur Windows ; réutilisable en mobile plus tard.
name = "gitlite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
thiserror = "1"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

# Trousseau système, pour que l'app stocke ses propres identifiants sans lancer
# de processus externe. Liaison au framework Security : rien n'est embarqué.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.6"

# Profil release orienté empreinte réduite (objectif du projet).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
